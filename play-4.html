<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NFTzWORLD HOOK #4 OFFER</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #stage { position: relative; width: min(100vw, 100vh); height: min(100vw, 100vh); touch-action: manipulation; }
    #case { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
    #glass, #glass * { box-sizing: border-box; }
    #glass {
      position: absolute; left:24.1211%;top:15.9180%;right:25.1953%;bottom:25.7812%;
      display: flex; flex-direction: column; background: #12040c;
      container-type: size; touch-action: manipulation; overflow: hidden;
      font-family: ui-monospace, Menlo, monospace; color: #fff7fb;
      --accent: #ff38e6; --accent-ink: #14060d; --edge: #ff38e6; --led: #ff38e6;
    }
    header, footer { flex: 0 0 auto; display: grid; align-items: center; gap: 1cqi; padding: 1.1cqi 1.2cqi 0; }
    header { grid-template-columns: auto auto 1fr auto auto; }
    footer { grid-template-columns: 1.15fr .7fr .95fr; padding: 0 1.2cqi 1.1cqi; }
    #mark, #track { font: 800 3.6cqi/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; color: var(--accent); }
    #track { justify-self: end; font-size: 2.6cqi; }
    #codeLamp { width: 1.8cqi; height: 1.8cqi; border-radius: 50%; background: #241f18; justify-self: start; }
    #glass.coding #codeLamp { background: var(--led); box-shadow: 0 0 8px var(--led); }
    button { font: 700 2.3cqi/1 ui-monospace, Menlo, monospace; letter-spacing: .04em; color: #fff7fb; background: #0c0308; border: 1px solid var(--edge); border-radius: .8cqi; min-height: 5.6cqi; padding: 0 1cqi; cursor: pointer; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #armBtn[aria-pressed="true"], #spaceBtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    #cutBtn { color: #ff8aa0; }
    #lcd {
      flex: 0 0 auto; margin: 1cqi 1.2cqi; min-height: 12cqi;
      background: #12060e; border-radius: 1cqi; padding: .8cqi 1.4cqi;
      display: flex; flex-direction: column; justify-content: center; gap: .35cqi;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
      overflow: hidden;
    }
    #lcdKicker { font: 700 2cqi/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; color: var(--accent); font-style: normal; }
    #lcdText {
      font: 650 3.1cqi/1.2 ui-monospace, Menlo, monospace; color: #f3ffe4;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    #keys {
      flex: 1 1 auto; min-height: 0;
      display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(8, 1fr);
      gap: .7cqi; padding: 0 1.2cqi .7cqi;
    }
    .key {
      min-width: 0; min-height: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1cqi;
      background: #2a1020; border: 1px solid var(--edge); border-radius: .8cqi; color: #fff7fb;
    }
    .key b { font: 800 2.15cqi/1 ui-monospace, Menlo, monospace; letter-spacing: 0; max-width: 100%; overflow: hidden; }
    .key small { font: 600 1.5cqi/1 ui-monospace, Menlo, monospace; color: #f0b4d4; letter-spacing: .06em; }
    .led { width: 1.3cqi; height: 1.3cqi; border-radius: 50%; background: #3d1428; }
    .key:active .led, .key.hot .led, .key.held .led { background: var(--led); box-shadow: 0 0 6px var(--led); }
    .key.miss .led { background: #ff3355; box-shadow: 0 0 6px #ff3355; }
    #glass.egg .led { background: var(--led); box-shadow: 0 0 8px var(--led); }
    @media (prefers-reduced-motion: reduce) {
      .key:active { transform: none; }
    }
  </style>
</head>

    const PITCH = {"Ralph": 0.7, "Zarvox": 0.55, "Whisper": 0.85, "Grandma": 1.15, "Grandpa": 0.75, "Junior": 1.25, "Fred": 0.9, "Albert": 0.95, "Bad News": 0.8, "Bahh": 0.6, "Trinoids": 0.7, "Boing": 1.2, "Bubbles": 1.3, "Cellos": 0.8, "Bells": 1.1, "Organ": 0.7, "Wobble": 1.15, "Jester": 1.1};
    const STORE = "nftzworld-hook-4";
    const HOLD_MS = 4000;
    const OPEN = ["OFFER", "i am an offer."];
    const glass = document.getElementById("glass");
    const keysEl = document.getElementById("keys");
    const armBtn = document.getElementById("armBtn");
    const cutBtn = document.getElementById("cutBtn");
    const voiceBtn = document.getElementById("voiceBtn");
    const spaceBtn = document.getElementById("spaceBtn");
    const holdBtn = document.getElementById("holdBtn");
    const lcdKicker = document.getElementById("lcdKicker");
    const lcdText = document.getElementById("lcdText");
    const buttons = [];
    const keymap = {};
    let voiceName = "Ralph";
    let armed = false;
    let heard = false;
    let talkToken = 0;
    let spaceOn = false;
    let buffer = [];
    let holdTimer = 0;
    let idleTimer = 0;
    let eggTimer = 0;
    let idleN = 0;
    let started = false;

    function load() {
      try {
        const raw = localStorage.getItem(STORE);
        const data = raw ? JSON.parse(raw) : null;
        return data && typeof data === "object" ? data : {};
      } catch (e) { return {}; }
    }
    function save() {
      try { localStorage.setItem(STORE, JSON.stringify({ voice: voiceName })); } catch (e) {}
    }
    function show(kicker, text) {
      lcdKicker.textContent = kicker;
      lcdText.textContent = text;
    }
    function same(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    }
    function isPrefix(seq, buf) {
      if (seq.length < buf.length) return false;
      for (let i = 0; i < buf.length; i++) if (seq[i] !== buf[i]) return false;
      return true;
    }
    function feed(index) {
      const had = buffer.length > 0;
      const nxt = buffer.concat([index]);
      if (same(nxt, EGG.seq)) {
        buffer = [];
        return { egg: EGG, broke: false };
      }
      if (isPrefix(EGG.seq, nxt)) {
        buffer = nxt;
        return { egg: null, broke: false };
      }
      const restarted = [index];
      if (isPrefix(EGG.seq, restarted)) {
        buffer = restarted;
        return { egg: null, broke: had };
      }
      buffer = [];
      return { egg: null, broke: had };
    }
    function paintHold() {
      glass.classList.toggle("coding", buffer.length > 0);
      holdBtn.textContent = buffer.length ? String(buffer.length) : "CODE";
      holdBtn.setAttribute("aria-label", buffer.length ? "Order length " + buffer.length : "No order yet");
    }
    function armHold() {
      paintHold();
      window.clearTimeout(holdTimer);
      if (!buffer.length) return;
      holdTimer = window.setTimeout(() => {
        buffer = [];
        paintHold();
        show("DROP", "Four seconds. The order dropped.");
      }, HOLD_MS);
    }
    function makeUtterance(text, name) {
      const u = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      const want = String(name || voiceName).toLowerCase();
      const hit = voices.find((v) => v.name.toLowerCase().indexOf(want) !== -1);
      if (hit) u.voice = hit;
      u.rate = RATES[name] || RATES[voiceName] || 1;
      u.pitch = PITCH[name] || PITCH[voiceName] || 1;
      return u;
    }
    function talk(text, name) {
      if (!armed) return;
      const synth = window.speechSynthesis;
      if (!synth) return;
      const my = ++talkToken;
      try { synth.cancel(); } catch (e) {}
      try { synth.resume(); } catch (e) {}
      const u = makeUtterance(text, name);
      u.onerror = (ev) => {
        if (my !== talkToken) return;
        const err = (ev && ev.error) || "";
        if (err === "interrupted" || err === "canceled" || err === "cancelled") return;
      };
      try { synth.speak(u); } catch (e) {}
    }
    function cut() {
      talkToken += 1;
      if (window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      show("CUT", "Clip stopped.");
    }
    function paintVoice() {
      voiceBtn.textContent = voiceName.toUpperCase();
      voiceBtn.setAttribute("aria-label", "Voice " + voiceName + ". Tap for the next voice.");
    }
    function paintArm() {
      armBtn.setAttribute("aria-pressed", armed ? "true" : "false");
      armBtn.textContent = armed ? "ARMED" : "ARM";
    }
    function paintSpace() {
      spaceBtn.setAttribute("aria-pressed", spaceOn ? "true" : "false");
      spaceBtn.textContent = spaceOn ? "IN SPACE" : "SPACE";
    }
    function toggleArm() {
      heard = true;
      started = true;
      armed = !armed;
      paintArm();
      if (!armed) {
        talkToken += 1;
        if (window.speechSynthesis) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        show("MUTED", "Muted. Tap ARM to hear the keys.");
      } else {
        show("ARMED", spaceOn ? "Armed. A Space hears this Mac output." : "Armed. Tap a key.");
        talk("Armed.", voiceName);
      }
    }
    function toggleSpace() {
      spaceOn = !spaceOn;
      paintSpace();
      show(spaceOn ? "IN SPACE" : "DESK", spaceOn ? "Point the Space mic at this Mac output. BlackHole or Loopback." : "Desk mode. Tap a key.");
    }
    function cycleVoice() {
      const i = VOICES.indexOf(voiceName);
      voiceName = VOICES[(i + 1) % VOICES.length];
      save();
      paintVoice();
      show("VOICE", voiceName);
      if (armed) talk(voiceName + ".", voiceName);
    }
    function flash(i) {
      const el = buttons[i];
      el.classList.add("hot");
      window.setTimeout(() => el.classList.remove("hot"), 240);
    }
    function miss(i) {
      const el = buttons[i];
      el.classList.add("miss");
      window.setTimeout(() => el.classList.remove("miss"), 200);
    }
    function celebrate() {
      glass.classList.add("egg");
      window.clearTimeout(eggTimer);
      eggTimer = window.setTimeout(() => glass.classList.remove("egg"), 2800);
    }
    function idleLine() {
      const rows = [
        OPEN,
        ["ORDER", "One order. The lamp counts."],
        ["KEYS", "Thirty-two keys. The top is the desk. The bottom is the holder."],
        ["CUT", "Cut stops the clip."],
        ["SPACE", spaceOn ? "Point the Space mic at this Mac output." : "Space mode is how a room hears the clip."]
      ];
      return rows[idleN % rows.length];
    }
    function pokeIdle() {
      started = true;
      window.clearTimeout(idleTimer);
      idleTimer = window.setTimeout(stepIdle, 7000);
    }
    function stepIdle() {
      if (buffer.length || glass.classList.contains("egg") || !started) {
        idleTimer = window.setTimeout(stepIdle, 1000);
        return;
      }
      const row = idleLine();
      show(row[0], row[1]);
      idleN += 1;
      idleTimer = window.setTimeout(stepIdle, 4200);
    }
    function press(i) {
      flash(i);
      if (!heard) {
        heard = true;
        armed = true;
        paintArm();
      }
      const result = feed(i);
      armHold();
      if (result.egg) {
        show(result.egg.name, result.egg.show);
        talk(result.egg.say, result.egg.voice);
        celebrate();
      } else {
        show(armed ? "SAYS" : "MUTED", KEYS[i].show);
        talk(KEYS[i].say, voiceName);
        if (result.broke) miss(i);
      }
      pokeIdle();
    }
    let cells = "";
    for (let i = 0; i < KEYS.length; i++) {
      const k = KEYS[i];
      keymap[k.key] = i;
      cells += '<button type="button" class="key" data-i="' + i + '" aria-label="' + k.code + ". " + k.show + '" aria-keyshortcuts="' + k.key + '"><i class="led" aria-hidden="true"></i><b>' + k.code + '</b><small>' + k.key + '</small></button>';
    }
    keysEl.innerHTML = cells;
    for (let i = 0; i < KEYS.length; i++) buttons.push(keysEl.children[i]);
    keysEl.addEventListener("click", (ev) => {
      const el = ev.target.closest("button");
      if (!el || el.dataset.i == null) return;
      press(el.dataset.i | 0);
    });
    armBtn.addEventListener("click", toggleArm);
    cutBtn.addEventListener("click", cut);
    voiceBtn.addEventListener("click", cycleVoice);
    spaceBtn.addEventListener("click", toggleSpace);
    holdBtn.addEventListener("click", () => {
      show("CODE", buffer.length ? "Order is " + buffer.length + " long." : "One order. The lamp counts.");
    });
    window.addEventListener("keydown", (ev) => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.repeat) return;
      const k = ev.key.toLowerCase();
      if (k === "escape" || k === " ") {
        ev.preventDefault();
        cut();
        return;
      }
      if (Object.prototype.hasOwnProperty.call(keymap, k)) {
        ev.preventDefault();
        press(keymap[k]);
      }
    });
    const saved = load();
    if (VOICES.indexOf(saved.voice) !== -1) voiceName = saved.voice;
    paintVoice();
    paintArm();
    paintSpace();
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.addEventListener("voiceschanged", paintVoice);
    }
  })();
  </script>
</body>
</html>
